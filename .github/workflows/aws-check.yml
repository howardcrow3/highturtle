name: AWS check (read-only)

# Confirms the AWS credentials work and shows what already exists for highturtle.com.
# Makes no changes. Run it from the Actions tab.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Who am I
        run: aws sts get-caller-identity --query Arn --output text

      - name: Route 53 hosted zone for highturtle.com
        continue-on-error: true
        run: aws route53 list-hosted-zones-by-name --dns-name highturtle.com --max-items 1 --query 'HostedZones[].{Name:Name,Id:Id}' --output table

      - name: Domains registered in Route 53
        continue-on-error: true
        run: aws route53domains list-domains --query 'Domains[].DomainName' --output text

      - name: Existing certificates in us-east-1
        continue-on-error: true
        run: aws acm list-certificates --query 'CertificateSummaryList[].{Domain:DomainName,Arn:CertificateArn}' --output table

      - name: Existing CloudFront aliases
        continue-on-error: true
        run: aws cloudfront list-distributions --query 'DistributionList.Items[].{Id:Id,Aliases:Aliases.Items}' --output json

      - name: Existing buckets
        continue-on-error: true
        run: aws s3api list-buckets --query 'Buckets[].Name' --output text
