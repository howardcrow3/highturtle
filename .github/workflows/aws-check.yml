name: AWS check (read-only)

# Confirms the AWS credentials work and shows what already exists for highturtle.com.
# Makes no changes. Results appear as annotations on the run. Run it from the Actions tab.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Report
        run: |
          report() {
            title="$1"; shift
            out="$("$@" 2>&1)" || out="FAILED: ${out}"
            out="${out//'%'/'%25'}"; out="${out//$'\n'/'%0A'}"; out="${out//$'\r'/'%0D'}"
            echo "::notice title=${title}::${out}"
          }
          report "identity" aws sts get-caller-identity --query Arn --output text
          report "bucket region" aws s3api get-bucket-location --bucket highturtle.com
          report "bucket objects" aws s3 ls s3://highturtle.com --recursive --human-readable --summarize
          report "bucket website" aws s3api get-bucket-website --bucket highturtle.com
          report "bucket public access" aws s3api get-public-access-block --bucket highturtle.com
          report "bucket policy" aws s3api get-bucket-policy --bucket highturtle.com --query Policy --output text
          report "dns records" aws route53 list-resource-record-sets --hosted-zone-id Z06718022U4OGOJU3B5U4 --query 'ResourceRecordSets[].[Name,Type]' --output text
