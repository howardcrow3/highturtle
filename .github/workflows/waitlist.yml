name: Send queued confirmations (one time)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2
      - shell: bash
        run: |
          pip install -q -U boto3
          acct=$(aws sesv2 get-account --query '{prod:ProductionAccessEnabled,quota:SendQuota.Max24HourSend,rate:SendQuota.MaxSendRate}' --output json | tr -d '\n ')
          echo "::notice title=ses::$acct"
          out=$(python3 infra/process_waitlist.py 2>&1 | tail -3 | tr '\n' ' ')
          echo "::notice title=waitlist::$out"
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Accept: application/json' -d 'email=bad' https://highturtle.com/api/subscribe)
          echo "::notice title=api::bad-email=$code"
