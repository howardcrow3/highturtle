name: Golden Plaid service (deploy)

# Deploys the Golden app's Plaid sync service (AWS Lambda + Function URL, us-east-2) using this repo's
# AWS keys, so they never need copying to the Golden repo. The service code is bundled below
# (from howardcrow3/golden services/plaid-server). Optional secrets: GOLDEN_PLAID_CLIENT_ID, GOLDEN_PLAID_SECRET.

on:
  push:
    branches: [claude/golden-plaid-deploy]
    paths: [.github/workflows/golden-plaid-deploy.yml]
  workflow_dispatch:
    inputs:
      plaid_env:
        description: Plaid environment
        type: choice
        options: [sandbox, production]
        default: sandbox

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLAID_CLIENT_ID: ${{ secrets.GOLDEN_PLAID_CLIENT_ID }}
      PLAID_SECRET: ${{ secrets.GOLDEN_PLAID_SECRET }}
      PLAID_ENV: ${{ inputs.plaid_env || 'sandbox' }}
      BUNDLE: 
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2
      - name: Deploy
        run: |
          mkdir -p svc && cd svc
          echo "$BUNDLE" | base64 -d | tar xz
          export GOLDEN_LICENCE_PUBLIC_KEY="$(cat license_public_key.txt)"
          bash deploy.sh
