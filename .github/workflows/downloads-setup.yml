name: Turtlebox downloads setup (one time)

# Creates the certificate, CloudFront distribution, DNS records and deploy role.
# Safe to re-run. Uses the temporary AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY secrets;
# delete those secrets and the key after setup.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2
      - name: Run setup
        shell: bash
        run: |
          set -o pipefail
          bash infra/setup-downloads.sh 2>&1 | tee /tmp/log.txt
      - name: Smoke test
        if: always()
        run: |
          a=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Accept: application/json' -d 'email=bad&app=nothing' https://turtlebox.studio/api/download || true)
          b=$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' 'https://turtlebox.studio/api/get?t=bogus' || true)
          echo "::notice title=smoke::bad-request=$a bad-token=$b"
          tail -n 4 /tmp/log.txt | cut -c1-300 | awk '{printf "%s%%0A", $0}' | sed 's/^/::notice title=log::/'
