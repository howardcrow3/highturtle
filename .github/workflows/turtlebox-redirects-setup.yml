name: Turtlebox domain redirects setup (one time)

# Redirects turtlebox.app, turtlebox.io and turtlebox.co (and www) to turtlebox.studio.
# Safe to re-run. Uses the temporary AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY secrets.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Run setup
        shell: bash
        run: |
          set -o pipefail
          bash infra/setup-turtlebox-redirects.sh 2>&1 | tee /tmp/log.txt
      - name: Smoke test
        if: always()
        shell: bash
        run: |
          sleep 30
          for d in turtlebox.app www.turtlebox.app turtlebox.io www.turtlebox.io turtlebox.co www.turtlebox.co; do
            r=$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' "https://$d/apps/?x=1" || echo "fail")
            echo "::notice title=$d::$r"
          done
