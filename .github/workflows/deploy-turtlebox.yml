name: Deploy turtlebox.studio

# Publishes the turtlebox/ folder to S3 and clears the CloudFront cache when it changes on main.

on:
  push:
    branches: [main]
    paths: ["turtlebox/**", "backer/**", "legal/**", "lambda/downloads.py", "lambda/report.py", "billing/**", ".github/workflows/deploy-turtlebox.yml"]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-turtlebox
  cancel-in-progress: false

env:
  AWS_ROLE_ARN: arn:aws:iam::022621302198:role/turtlebox-github-deploy
  AWS_REGION: us-east-2
  S3_BUCKET: turtlebox.studio
  CLOUDFRONT_DISTRIBUTION_ID: E3AFT58QXC1DZ0

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Fetch the published Backer releases (release notes and downloads pages)
        run: python3 backer/fetch_releases.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Build store pages (Golden plan prices come from repository variables)
        run: python3 turtlebox/build.py
        env:
          GOLDEN_PLAID_PRICE_ID: ${{ vars.GOLDEN_PLAID_PRICE_ID }}
          GOLDEN_PLAID_ANNUAL: ${{ vars.GOLDEN_PLAID_ANNUAL }}
      - name: Build Backer pages (skipped until backer/config.json is complete)
        run: python3 backer/build.py
      - name: Upload assets
        run: |
          aws s3 sync turtlebox/assets "s3://${{ env.S3_BUCKET }}/assets" \
            --delete --cache-control "public, max-age=3600, must-revalidate"
      - name: Upload pages and root files (always revalidated)
        run: |
          aws s3 sync turtlebox "s3://${{ env.S3_BUCKET }}" \
            --delete \
            --exclude "assets/*" --exclude "*.py" --exclude "__pycache__/*" --exclude "apps.json" --exclude "design-system/*" \
            --cache-control "no-cache"
      - name: Update the downloads function
        run: |
          (cd lambda && zip -q ../downloads.zip downloads.py)
          aws lambda update-function-code --function-name turtlebox-downloads --zip-file fileb://downloads.zip >/dev/null
      - name: Update the report function (if it exists)
        run: |
          if aws lambda get-function --function-name backer-report >/dev/null 2>&1; then
            (cd lambda && zip -q ../report.zip report.py)
            aws lambda update-function-code --function-name backer-report --zip-file fileb://report.zip >/dev/null
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update the billing function (if it exists; created by the Billing setup workflow)
        run: |
          if aws lambda get-function --function-name turtlebox-billing >/dev/null 2>&1; then
            (cd billing && npm ci --no-audit --no-fund && npm test && npm run build)
            (cd billing/dist && zip -q ../../billing.zip index.mjs)
            aws lambda update-function-code --function-name turtlebox-billing --zip-file fileb://billing.zip >/dev/null
          fi

      - name: Clear the CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ env.CLOUDFRONT_DISTRIBUTION_ID }}" --paths "/*"
      - name: Check the live site
        run: |
          sleep 20
          for u in https://turtlebox.studio/ https://turtlebox.studio/apps/ https://www.turtlebox.studio/ https://turtlebox.studio/nope https://highturtle.com/turtlebox/index.html; do
            echo "$u $(curl -s -o /dev/null -w '%{http_code}' "$u")"
          done | awk '{printf "%s%%0A", $0}' | sed 's/^/::notice title=live::/'
