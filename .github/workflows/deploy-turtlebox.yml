name: Deploy turtlebox.studio

# Publishes the turtlebox/ folder to S3 and clears the CloudFront cache when it changes on main.

on:
  push:
    branches: [main]
    paths: ["turtlebox/**", "lambda/downloads.py", ".github/workflows/deploy-turtlebox.yml"]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-turtlebox
  cancel-in-progress: false

env:
  AWS_ROLE_ARN: arn:aws:iam::022621302198:role/turtlebox-github-deploy
  AWS_REGION: us-east-2
  S3_BUCKET: turtlebox.studio
  CLOUDFRONT_DISTRIBUTION_ID: E3AFT58QXC1DZ0

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Upload assets
        run: |
          aws s3 sync turtlebox/assets "s3://${{ env.S3_BUCKET }}/assets" \
            --delete --cache-control "public, max-age=3600, must-revalidate"
      - name: Upload pages and root files (always revalidated)
        run: |
          aws s3 sync turtlebox "s3://${{ env.S3_BUCKET }}" \
            --delete \
            --exclude "assets/*" --exclude "build.py" --exclude "apps.json" \
            --cache-control "no-cache"
      - name: Update the downloads function
        run: |
          (cd lambda && zip -q ../downloads.zip downloads.py)
          aws lambda update-function-code --function-name turtlebox-downloads --zip-file fileb://downloads.zip >/dev/null

      - name: Clear the CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ env.CLOUDFRONT_DISTRIBUTION_ID }}" --paths "/*"
      - name: Check the live site
        run: |
          sleep 20
          for u in https://turtlebox.studio/ https://turtlebox.studio/apps/ https://www.turtlebox.studio/ https://turtlebox.studio/nope https://highturtle.com/turtlebox/index.html; do
            echo "$u $(curl -s -o /dev/null -w '%{http_code}' "$u")"
          done | awk '{printf "%s%%0A", $0}' | sed 's/^/::notice title=live::/'
