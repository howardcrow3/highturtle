name: Deploy to AWS

# Publishes the site to S3 and clears the CloudFront cache on every push to main.
# One-time setup is described in README.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  AWS_ROLE_ARN: arn:aws:iam::022621302198:role/highturtle-github-deploy
  AWS_REGION: us-east-2
  S3_BUCKET: highturtle.com
  CLOUDFRONT_DISTRIBUTION_ID: E3GVOW0DH898BT

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload assets (cached for a day)
        run: |
          aws s3 sync assets "s3://${{ env.S3_BUCKET }}/assets" \
            --delete --cache-control "public, max-age=3600, must-revalidate"

      - name: Upload pages and root files (always revalidated)
        run: |
          aws s3 sync . "s3://${{ env.S3_BUCKET }}" \
            --delete \
            --exclude ".git/*" --exclude ".github/*" --exclude "assets/*" \
            --exclude "README.md" --exclude "infra/*" --exclude "lambda/*" --exclude "issues/*" --exclude "turtlebox/*" \
            --cache-control "no-cache"

      - name: Remove folders that belong to other sites
        run: aws s3 rm "s3://${{ env.S3_BUCKET }}/turtlebox/" --recursive

      - name: Update the subscription function
        run: |
          (cd lambda && zip -q ../lambda.zip handler.py)
          aws lambda update-function-code --function-name highturtle-subscribe --zip-file fileb://lambda.zip >/dev/null

      - name: Clear the CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ env.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"
