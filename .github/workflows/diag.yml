name: Diagnose signup (temporary)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2
      - shell: bash
        run: |
          set +e
          acct=$(aws sesv2 get-account --query '{prod:ProductionAccessEnabled,sending:SendingEnabled,review:Details.ReviewDetails,quota:SendQuota}' --output json | tr -d '\n ')
          echo "::notice title=ses::$acct"
          L=$(aws logs filter-log-events --log-group-name /aws/lambda/highturtle-subscribe --start-time $(( ($(date +%s) - 172800) * 1000 )) --filter-pattern '"error"' --query 'events[-6:].message' --output text 2>&1 | head -c 1500 | tr '\n\t' '  ')
          echo "::notice title=logs::$L"
          code=$(curl -s -o /tmp/r.txt -w '%{http_code}' -X POST -H 'Accept: application/json' -d 'email=diag-test@example.com' https://highturtle.com/api/subscribe)
          echo "::notice title=post::$code $(head -c 200 /tmp/r.txt)"
          page=$(curl -s https://highturtle.com/ | grep -o '<form[^>]*>' | head -2)
          js=$(curl -s https://highturtle.com/assets/site.js | grep -c "api\|YOUR_FORM_ID\|formspree")
          echo "::notice title=page::$page jsmatches=$js"
          aws dynamodb delete-item --table-name highturtle-pending --key "{\"pk\":{\"S\":\"w#$(printf %s diag-test@example.com | sha256sum | cut -d' ' -f1)\"}}"
