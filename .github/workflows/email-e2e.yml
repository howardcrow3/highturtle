name: Email end-to-end test (temporary)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2
      - shell: bash
        run: |
          set +e
          out=""
          E=howardcrow@gmail.com
          a=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Accept: application/json' -d "email=$E" https://highturtle.com/api/subscribe)
          out="subscribe=$a"
          sleep 3
          T=$(aws dynamodb scan --table-name highturtle-pending --query "Items[?email.S=='$E'].pk.S | [0]" --output text | sed 's/^p#//')
          out="$out token=${T:0:6}..."
          c=$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' "https://highturtle.com/api/confirm?t=$T")
          out="$out confirm=[$c]"
          st=$(aws sesv2 get-contact --contact-list-name highturtle-subscribers --email-address $E --query '[EmailAddress,UnsubscribeAll]' --output text 2>&1 | head -c 150)
          out="$out contact=[$st]"
          echo "::notice title=e2e::$out"
          pip install -q boto3 markdown 2>&1 | tail -1
          export UNSUBSCRIBE_SECRET=$(aws lambda get-function-configuration --function-name highturtle-subscribe --query 'Environment.Variables.SECRET' --output text)
          s=$(python3 infra/send_issue.py issues/example-first-issue.md --test $E 2>&1 | tail -3 | tr '\n' ' ')
          echo "::notice title=sendtest::$s"
          # unsubscribe link check (GET page, then POST)
          sig=$(python3 -c "import hmac,hashlib,os;print(hmac.new(os.environ['UNSUBSCRIBE_SECRET'].encode(),b'unsub:$E',hashlib.sha256).hexdigest()[:32])")
          g=$(curl -s -o /dev/null -w '%{http_code}' "https://highturtle.com/api/unsubscribe?e=$E&s=$sig")
          bad=$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' "https://highturtle.com/api/unsubscribe?e=$E&s=deadbeef")
          p=$(curl -s -o /dev/null -w '%{http_code}' -X POST -d 'List-Unsubscribe=One-Click' "https://highturtle.com/api/unsubscribe?e=$E&s=$sig")
          st2=$(aws sesv2 get-contact --contact-list-name highturtle-subscribers --email-address $E --query 'UnsubscribeAll' --output text 2>&1 | head -c 50)
          echo "::notice title=unsub::get=$g badsig=[$bad] post=$p unsubscribed=$st2"
