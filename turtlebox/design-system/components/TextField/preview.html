<!-- @dsCard group="Forms" height=340 subtitle="Email field, error and success" -->
<body class="tb-surface" style="margin:0;padding:var(--g-space-md)">
<form class="dl-form" onsubmit="return false" style="max-width:24rem"><label for="e1">Email address</label><input id="e1" type="email" placeholder="you@company.com"><p class="form-status is-error" role="status">That address does not look right. Check it and try again.</p></form>
<form class="dl-form" onsubmit="return false" style="max-width:24rem;margin-top:var(--g-space-md)"><label for="e2">Email address</label><input id="e2" type="email" value="you@company.com"><p class="form-status is-ok" role="status">Sent. Check your inbox for the download link.</p></form>
</body>
